name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Report errors 1-10
        if: failure()
        run: python3 .github/scripts/report.py 0
      - name: Report errors 11-20
        if: failure()
        run: python3 .github/scripts/report.py 10
      - name: Report errors 21-30
        if: failure()
        run: python3 .github/scripts/report.py 20
      - name: Report errors 31-40
        if: failure()
        run: python3 .github/scripts/report.py 30

      - name: Collect APKs
        run: |
          mkdir -p out
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VERSION_NAME=$VN" >> "$GITHUB_ENV"
          # Version-numbered filenames. Installing still updates the previous
          # version in place (Android keys updates on package id + signature, not file name).
          cp app/build/outputs/apk/release/app-release.apk "out/TaskPilot-${VN}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "out/TaskPilot-${VN}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-apk
          path: out/*.apk

      # A release gives a direct download link that works from the phone's browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-build${{ github.run_number }}
          name: TaskPilot ${{ env.VERSION_NAME }} (build ${{ github.run_number }})
          body: "Install **TaskPilot-${{ env.VERSION_NAME }}.apk** on your phone. Builds are signed with the same key, so each one installs over the previous one and keeps your automations."
          files: out/*.apk
