name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleRelease assembleDebug --stacktrace --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/TaskPilot.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/TaskPilot-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TaskPilot-apk
          path: out/*.apk

      # A release gives a direct download link that works from the phone's browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TaskPilot build ${{ github.run_number }}
          body: "Install **TaskPilot.apk** on your phone. Builds are signed with the same key, so each one installs over the previous one and keeps your automations."
          files: out/*.apk
